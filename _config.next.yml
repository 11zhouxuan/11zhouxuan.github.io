# NexT Theme Configuration
# Docs: https://theme-next.js.org/docs/

# Scheme Settings
# Available: Muse | Mist | Pisces | Gemini
scheme: Mist

# Dark Mode (auto switch based on system preference)
darkmode: false

# Site Information
favicon:
  small: /images/favicon-16x16.png
  medium: /images/favicon-32x32.png

# Menu Settings
menu:
  home: / || fa fa-home
  archives: /archives/ || fa fa-archive
  tags: /tags/ || fa fa-tags
  categories: /categories/ || fa fa-folder-open
  about: /about/ || fa fa-user

# Sidebar Settings
sidebar:
  position: right
  display: hide

# Avatar (disabled - no image uploaded yet)
#avatar:
#  url: /images/avatar.png
#  rounded: true
#  rotated: false

# Social Links
social:
  GitHub: https://github.com/11zhouxuan || fab fa-github
  #Email: mailto:your-email@example.com || fa fa-envelope

# Table of Contents in sidebar
toc:
  enable: true
  number: false
  wrap: false
  expand_all: true

# Sidebar panel
sidebar_panel:
  toc: true
  overview: false

# Code Block
codeblock:
  copy_button:
    enable: true
    style: mac

# Back to top button
back2top:
  enable: true
  sidebar: false
  scrollpercent: true

# Reading progress bar
reading_progress:
  enable: true
  position: top
  color: "#1565C0"
  height: 3px

# Math Equations (MathJax)
math:
  every_page: false
  mathjax:
    enable: true
    tags: ams

# Font Settings
font:
  enable: false

# Search (local search)
local_search:
  enable: true
  trigger: auto
  top_n_per_article: 3
  unescape: false
  preload: false

# Footer
footer:
  since: 2025
  icon:
    name: fa fa-heart
    animated: true
    color: "#ff0000"
  copyright: false
  powered: false

# Custom files to inject
custom_file_path:
  head: source/_data/head.njk
  style: source/_data/styles.styl

# Post Settings
post_meta:
  item_text: true
  created_at: true
  updated_at:
    enable: true
    another_day: true
  categories: true

# Related Posts
related_posts:
  enable: true

# Tag icon (use # or icon)
tag_icon: true

# Busuanzi visitor counter (不蒜子统计)
busuanzi_count:
  enable: true
  total_visitors: true
  total_visitors_icon: fa fa-user
  total_views: true
  total_views_icon: fa fa-eye
  post_views: true
  post_views_icon: far fa-eye
